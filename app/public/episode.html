<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết tập | Podcast Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.65 "DM Sans", sans-serif;
      color: #f7f7f7;
      background: #000;
      --ink: #f7f7f7;
      --muted: #b3b3b3;
      --line: #303030;
      --paper: #181818;
      --forest: #1ed760;
      --coral: #1ed760;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; margin: 0; background: #000; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1080px, calc(100% - 56px)); margin: 0 auto; }
    .topbar { display: flex; min-height: 76px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px 12px 12px 4px; background: var(--forest); color: #08200f; font-size: 19px; font-weight: 800; }
    .brand-name { font-size: 18px; font-weight: 700; }
    .back-link { color: var(--forest); font-size: 13px; font-weight: 700; text-decoration: none; }
    .back-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .detail-panel { position: relative; overflow: hidden; margin: 38px 0 18px; padding: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .detail-panel::before { position: absolute; inset: 0 0 auto; height: 8px; background: linear-gradient(90deg, #1ed760, #08752e); content: ""; }
    .detail-label { margin: 0 0 13px; color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    h1 { max-width: 760px; margin: 0 0 12px; color: var(--ink); font-size: clamp(32px, 5vw, 48px); font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; }
    .categories { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 24px; color: var(--forest); font-size: 12px; }
    .category-chip { padding: 4px 9px; border-radius: 3px; background: #242424; color: #d5f5df; font-weight: 700; }
    .description { max-width: 680px; margin: 0; color: #b3b3b3; font-size: 16px; white-space: pre-wrap; }
    audio { display: block; width: 100%; margin: 28px 0 12px; }
    .video-frame { width: 100%; aspect-ratio: 16 / 9; margin: 28px 0 12px; background: #080808; }
    .video-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .audio-missing { padding: 15px 17px; border-left: 3px solid var(--coral); background: #202520; color: #d0d0d0; }
    .source-link { display: inline-block; margin-top: 8px; color: var(--forest); font-weight: 700; }
    time, #status { color: var(--muted); font-size: 13px; }
    .actions, form { display: grid; gap: 10px; }
    .actions { grid-template-columns: auto auto; justify-content: start; margin: 0 0 24px; }
    input, textarea, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cbd3cb; border-radius: 3px; background: #fff; color: var(--ink); }
    input:focus, textarea:focus, select:focus { border-color: var(--forest); outline: 3px solid rgb(23 107 97 / 12%); }
    textarea { min-height: 100px; resize: vertical; }
    button { min-height: 40px; padding: 9px 14px; border: 0; border-radius: 20px; background: var(--forest); color: #08200f; font-weight: 700; }
    button:hover { filter: brightness(.91); }
    button.danger { background: #9e403d; }
    button:focus-visible, a:focus-visible { outline: 3px solid #1ed760; outline-offset: 3px; }
    [role="status"] { min-height: 1.5em; color: #70e39c; font-size: 13px; }
    dialog { width: min(520px, calc(100% - 32px)); padding: 25px; border: 1px solid #454545; border-radius: 8px; background: var(--paper); color: var(--ink); box-shadow: 0 24px 80px rgb(0 0 0 / 65%); }
    dialog::backdrop { background: rgb(0 0 0 / 72%); backdrop-filter: blur(3px); }
    dialog input, dialog textarea, dialog select { border-color: #454545; background: #242424; color: #fff; }
    button.danger { background: #a94442; color: #fff; }
    dialog h2 { font-weight: 700; }
    @media (max-width: 620px) {
      .shell { width: calc(100% - 28px); }
      .topbar { min-height: 64px; }
      .detail-panel { margin-top: 22px; padding: 30px 20px; }
      .actions { margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Podcast Media, trang chủ">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-name">Podcast Media</span>
      </a>
      <a class="back-link" href="/">← Tất cả tập</a>
    </header>
    <article class="detail-panel" id="episode" aria-live="polite">
      <p id="status">Đang tải tập podcast...</p>
    </article>
    <div class="actions" id="episode-actions" hidden>
      <button type="button" id="edit-episode">Sửa tập</button>
      <button type="button" class="danger" id="delete-episode">Xóa tập</button>
    </div>
    <p id="action-status" role="status"></p>
  </div>

  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <h2 id="edit-heading">Sửa tập podcast</h2>
    <form id="edit-form">
      <input name="title" maxlength="200" placeholder="Tên tập" required>
      <textarea name="description" placeholder="Mô tả"></textarea>
      <select name="category_id" id="category-select" aria-label="Danh mục"></select>
      <input name="audio_url" type="url" maxlength="500" placeholder="Link audio hoặc video YouTube">
      <div class="actions">
        <button type="button" class="danger" id="cancel-edit">Hủy</button>
        <button type="submit">Lưu thay đổi</button>
      </div>
    </form>
    <p id="edit-status" role="status"></p>
  </dialog>

  <script>
    const episodeElement = document.querySelector('#episode');
    const episodeId = new URLSearchParams(window.location.search).get('id');
    const editDialog = document.querySelector('#edit-dialog');
    const editForm = document.querySelector('#edit-form');
    const categorySelect = document.querySelector('#category-select');
    const editStatus = document.querySelector('#edit-status');
    const actionStatus = document.querySelector('#action-status');
    let currentEpisode;

    function getYouTubeVideoId(source) {
      let url;
      try {
        url = new URL(source);
      } catch {
        return null;
      }

      const hostname = url.hostname.toLowerCase().replace(/^www\./, '');
      let videoId = null;
      if (hostname === 'youtu.be') {
        videoId = url.pathname.split('/').filter(Boolean)[0];
      } else if (hostname === 'youtube.com' || hostname === 'm.youtube.com' || hostname === 'youtube-nocookie.com') {
        videoId = url.searchParams.get('v');
        if (!videoId) {
          videoId = url.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)/)?.[1] || null;
        }
      }

      return videoId && /^[A-Za-z0-9_-]{11}$/.test(videoId) ? videoId : null;
    }

    function createSourceLink(source, label) {
      const link = document.createElement('a');
      link.className = 'source-link';
      link.href = source;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = label;
      return link;
    }

    async function loadEpisode() {
      if (!episodeId || !/^\d+$/.test(episodeId)) {
        throw new Error('ID tập podcast không hợp lệ.');
      }

      const response = await fetch(`/api/episodes/${encodeURIComponent(episodeId)}`);
      const episode = await response.json();
      if (!response.ok) throw new Error(episode.error || 'Không tải được tập podcast.');
      const categoriesResponse = await fetch('/api/categories');
      if (!categoriesResponse.ok) throw new Error('Không tải được danh mục.');
      const categories = await categoriesResponse.json();
      currentEpisode = episode;

      episodeElement.replaceChildren();
      const label = document.createElement('p');
      label.className = 'detail-label';
      label.textContent = 'PODCAST / TẬP PHÁT';
      const heading = document.createElement('h1');
      heading.textContent = episode.title;
      episodeElement.append(label, heading);

      if (episode.categories.length) {
        const category = document.createElement('p');
        category.className = 'categories';
        for (const item of episode.categories) {
          const chip = document.createElement('span');
          chip.className = 'category-chip';
          chip.textContent = item.name;
          category.append(chip);
        }
        episodeElement.append(category);
      }

      if (episode.description) {
        const description = document.createElement('p');
        description.className = 'description';
        description.textContent = episode.description;
        episodeElement.append(description);
      }

      if (episode.audio_url) {
        const youtubeVideoId = getYouTubeVideoId(episode.audio_url);
        if (youtubeVideoId) {
          const frame = document.createElement('div');
          frame.className = 'video-frame';
          const player = document.createElement('iframe');
          player.src = `https://www.youtube-nocookie.com/embed/${youtubeVideoId}`;
          player.title = `Phát ${episode.title} trên YouTube`;
          player.allow = 'encrypted-media; picture-in-picture';
          player.allowFullscreen = true;
          player.referrerPolicy = 'strict-origin-when-cross-origin';
          frame.append(player);
          episodeElement.append(frame);
        } else {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.preload = 'metadata';
          audio.src = episode.audio_url;
          audio.setAttribute('aria-label', `Nghe thử ${episode.title}`);
          audio.addEventListener('error', () => {
            const notice = document.createElement('p');
            notice.className = 'audio-missing';
            let host = '';
            try {
              host = new URL(episode.audio_url).hostname.toLowerCase().replace(/^www\./, '');
            } catch {
              host = '';
            }
            notice.textContent = host === 'youtube.com' || host === 'youtu.be'
              ? 'Đây là trang YouTube, không phải file audio hay link video cụ thể.'
              : 'Không phát được nguồn này. Hãy dùng link file audio trực tiếp hoặc link video YouTube.';
            notice.append(createSourceLink(episode.audio_url, 'Mở nguồn audio'));
            audio.replaceWith(notice);
          }, { once: true });
          episodeElement.append(audio);
        }

        let sourceUrl;
        try {
          sourceUrl = new URL(episode.audio_url);
        } catch {
          sourceUrl = null;
        }
        if (sourceUrl?.hostname.toLowerCase().replace(/^www\./, '') === 'youtube.com'
          && sourceUrl.pathname === '/results') {
          const notice = document.createElement('p');
          notice.className = 'audio-missing';
          notice.textContent = 'Link tìm kiếm chưa xác định video để phát. Hãy thay bằng link của một video YouTube cụ thể.';
          notice.append(createSourceLink(episode.audio_url, 'Mở kết quả tìm kiếm'));
          episodeElement.querySelector('audio')?.replaceWith(notice);
        }
      } else {
        const notice = document.createElement('p');
        notice.className = 'audio-missing';
        notice.textContent = 'Tập này chưa có đường dẫn audio.';
        episodeElement.append(notice);
      }

      const date = document.createElement('time');
      date.dateTime = episode.created_at;
      date.textContent = new Date(episode.created_at).toLocaleString('vi-VN');
      date.className = 'episode-date';
      episodeElement.append(date);
      categorySelect.replaceChildren(new Option('Chọn danh mục', ''));
      for (const category of categories) {
        categorySelect.add(new Option(category.name, category.id));
      }
      categorySelect.value = episode.categories[0]?.id || '';
      document.querySelector('#episode-actions').hidden = false;
      document.title = `${episode.title} | Podcast Media`;
    }

    document.querySelector('#edit-episode').addEventListener('click', () => {
      editForm.elements.title.value = currentEpisode.title;
      editForm.elements.description.value = currentEpisode.description || '';
      editForm.elements.audio_url.value = currentEpisode.audio_url || '';
      editStatus.textContent = '';
      editDialog.showModal();
    });

    document.querySelector('#cancel-edit').addEventListener('click', () => editDialog.close());

    editForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(editForm);
      const response = await fetch(`/api/episodes/${encodeURIComponent(episodeId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: form.get('title'),
          description: form.get('description') || null,
          audio_url: form.get('audio_url') || null,
          category_id: form.get('category_id') || null,
        }),
      });
      const result = response.status === 204 ? null : await response.json();
      if (!response.ok) {
        editStatus.textContent = response.status === 409
          ? 'Tập có tiêu đề hoặc URL audio này đã tồn tại.'
          : result.error;
        return;
      }
      editDialog.close();
      actionStatus.textContent = 'Đã cập nhật tập.';
      await loadEpisode();
    });

    document.querySelector('#delete-episode').addEventListener('click', async () => {
      if (!window.confirm(`Xóa tập “${currentEpisode.title}”?`)) return;
      const response = await fetch(`/api/episodes/${encodeURIComponent(episodeId)}`, {
        method: 'DELETE',
      });
      if (!response.ok) {
        const result = await response.json();
        actionStatus.textContent = result.error || 'Không thể xóa tập.';
        return;
      }
      window.location.replace('/');
    });

    loadEpisode().catch((error) => {
      const status = document.querySelector('#status');
      status.textContent = error.message;
    });
  </script>
</body>
</html>
